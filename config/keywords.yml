# 探索阶段：每个方向一组关键词，用来算「素人爆款率 / 蓝海指数 / 单条成本 / 调性匹配」。
# 赛道定下来之后，把 focus 填上，只跑 focus 里的词，方向表自动停用。
directions:
  - name: 游戏
    keywords:
      - 游戏日常
      - 主机游戏
      - 游戏推荐
      - 单机游戏
  - name: 摄影
    keywords:
      - 手机摄影
      - 摄影日常
      - 拍照技巧
      - 胶片摄影
  - name: 日常记录
    keywords:
      - 日常记录
      - 生活碎片
      - 独居日常
      - 周末日常
  - name: 城市漫步
    keywords:
      - citywalk
      - 城市漫步
      - 城市探索
  - name: 数码体验
    keywords:
      - 数码好物
      - 桌面搭子
      - 生产力工具

# 监控阶段：填 3-5 个词后只跑这些
focus: []

# 每次采集跑三档：综合看基线，最热看什么在爆，最新+一周内看供给速度。
profile:
  - sort: 0
    note_time: 0
    limit: 40
  - sort: 2
    note_time: 0
    limit: 40
  - sort: 1
    note_time: 2
    limit: 40
