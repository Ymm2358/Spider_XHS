# 开发阶段的采样重点：日常 + 摄影，以及两者的交叉。
# 其他方向保留，但不作为日常采集的重点，避免把请求额度花在纯新垂类上。
directions:
  - name: 日常记录
    keywords:
      - 日常记录
      - 生活碎片
      - 独居日常
      - 周末日常
  - name: 摄影
    keywords:
      - 手机摄影
      - 摄影日常
      - 拍照技巧
      - 胶片摄影
  - name: 日常摄影
    keywords:
      - 随手拍
      - 生活感照片
      - 记录生活
      - 日常摄影

  - name: 游戏
    keywords:
      - 游戏日常
      - 主机游戏
      - 单机游戏
  - name: 城市漫步
    keywords:
      - citywalk
      - 城市漫步
  - name: 数码体验
    keywords:
      - 数码好物
      - 桌面搭子

# 日常采集只跑这三个方向。改这里就能换重点。
focus:
  - 日常记录
  - 摄影
  - 日常摄影

# 每次采集跑三档：综合看基线，最热看什么在爆，最新+一周内看供给速度。
profile:
  - sort: 0
    note_time: 0
    limit: 40
  - sort: 2
    note_time: 0
    limit: 40
  - sort: 1
    note_time: 2
    limit: 40
